services:

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: always
    ports:
      - "8080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENABLE_OLLAMA_API=false
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://adapter:4000/v1
      - OPENAI_API_KEY=${OPENWEBUI_ADAPTER_API_KEY}
      - ENABLE_IMAGE_GENERATION=true
      - IMAGE_GENERATION_ENGINE=openai
      - IMAGES_OPENAI_API_BASE_URL=http://adapter:4000/v1
      - IMAGES_OPENAI_API_KEY=${OPENWEBUI_ADAPTER_API_KEY}
      - IMAGE_GENERATION_MODEL=sd-cpp-local
      - ENABLE_IMAGE_EDIT=true
      - IMAGE_EDIT_ENGINE=openai
      - IMAGES_EDIT_OPENAI_API_BASE_URL=http://adapter:4000/v1
      - IMAGES_EDIT_OPENAI_API_KEY=${OPENWEBUI_ADAPTER_API_KEY}
      - IMAGE_EDIT_MODEL=sd-cpp-local
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://adapter:4000/v1
      - AUDIO_STT_OPENAI_API_KEY=${OPENWEBUI_ADAPTER_API_KEY}
      - AUDIO_STT_MODEL=Systran/faster-whisper-small
      - AUDIO_STT_OPENAI_API_REQUEST_FORMAT=multipart
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://adapter:4000/v1
      - AUDIO_TTS_OPENAI_API_KEY=${OPENWEBUI_ADAPTER_API_KEY}
      - AUDIO_TTS_MODEL=speaches-ai/Kokoro-82M-v1.0-ONNX
      - AUDIO_TTS_VOICE=ef_dora

    volumes:
      - open-webui-data:/app/backend/data

  caddy:
    image: caddy:latest
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/certs

  adapter:
    build: ./adapter
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./workspace:/workspace
      - /home/tupolev/test-app:/workspace/test-app
      - /home/tupolev/test-app-php:/workspace/test-app-php
    ports:
      - "4000:4000"

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./models:/models:ro
      - hf-cache:/root/.cache/huggingface
    command:
      - --hf-repo
      - ggml-org/Qwen3-8B-GGUF:Q8_0
      - --alias
      - qwen3:8b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --jinja
      - --metrics
      - --ctx-size
      - "32768"
      - --n-gpu-layers
      - "999"
      - --parallel
      - "1"
      - --n-predict
      - "1024"

  vision-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - --hf-repo
      - ggml-org/Qwen2.5-VL-3B-Instruct-GGUF:Q4_K_M
      - --alias
      - qwen2.5-vl:3b
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --jinja
      - --ctx-size
      - "8192"
      - --image-min-tokens
      - "1024"
      - --n-gpu-layers
      - "999"
      - --parallel
      - "1"
      - --n-predict
      - "1024"

  image-server:
    build: ./stable-diffusion
    restart: unless-stopped
    init: true
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./models/stable-diffusion:/models:ro
      - ./outputs:/output
    command:
      - --model
      - /models/v1-5-pruned_Q4_K.gguf
      - --listen-ip
      - 0.0.0.0
      - --listen-port
      - "7860"

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes:
      - speaches-cache:/home/ubuntu/.cache/huggingface

  prometheus:
    image: prom/prometheus
    restart: always
    ports:
      - "9090:9090"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - '--web.listen-address=0.0.0.0:9100'
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana

volumes:
  open-webui-data:
  hf-cache:
  speaches-cache:
