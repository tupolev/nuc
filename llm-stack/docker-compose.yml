services:

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: always
    ports:
      - "8080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENABLE_OLLAMA_API=false
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://adapter:4000/v1
      - OPENAI_API_KEY=${OPENWEBUI_ADAPTER_API_KEY}

    volumes:
      - open-webui-data:/app/backend/data

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/certs

  adapter:
    build: ./adapter
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./workspace:/workspace
      - /home/tupolev/test-app:/workspace/test-app
      - /home/tupolev/test-app-php:/workspace/test-app-php
    ports:
      - "4000:4000"

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./models:/models:ro
      - hf-cache:/root/.cache/huggingface
    command:
      - --hf-repo
      - ggml-org/Qwen3-8B-GGUF:Q8_0
      - --alias
      - qwen3:8b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --jinja
      - --ctx-size
      - "32768"
      - --n-gpu-layers
      - "999"
      - --parallel
      - "1"
      - --n-predict
      - "1024"

  prometheus:
    image: prom/prometheus
    restart: always
    ports:
      - "9090:9090"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - '--web.listen-address=0.0.0.0:9100'
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana

volumes:
  open-webui-data:
  hf-cache:
