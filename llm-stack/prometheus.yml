global:
  scrape_interval: 5s

scrape_configs:

  - job_name: llm-adapter
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["adapter:4000"]

  - job_name: llama-server
    static_configs:
      - targets: ["llama-server:8080"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
